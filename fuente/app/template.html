}
function cedulaOk(c) {
  c = String(c || "").replace(/\D/g, ""); if (c.length !== 10) return false;
  const p = +c.slice(0, 2); if (!((p >= 1 && p <= 24) || p === 30) || +c[2] >= 6) return false;
  let s = 0; for (let i = 0; i < 9; i++) { let v = +c[i] * (i % 2 ? 1 : 2); if (v > 9) v -= 9; s += v; }
  return (10 - (s % 10)) % 10 === +c[9];
}
const fmtCed = (c) => { c = String(c || "").replace(/\D/g, ""); return c.length === 10 ? c.slice(0, 9) + "-" + c[9] : c; };
function letras(n) {
  n = parseInt(n, 10); if (!(n >= 0) || n > 999) return "";
  const U = ["cero","uno","dos","tres","cuatro","cinco","seis","siete","ocho","nueve","diez","once","doce","trece","catorce","quince","dieciséis","diecisiete","dieciocho","diecinueve","veinte","veintiuno","veintidós","veintitrés","veinticuatro","veinticinco","veintiséis","veintisiete","veintiocho","veintinueve"];
  const D = ["","","","treinta","cuarenta","cincuenta","sesenta","setenta","ochenta","noventa"];
  const C = ["","ciento","doscientos","trescientos","cuatrocientos","quinientos","seiscientos","setecientos","ochocientos","novecientos"];
  const dec = (x) => x < 30 ? U[x] : D[Math.floor(x / 10)] + (x % 10 ? " y " + U[x % 10] : "");
  if (n < 100) return dec(n); if (n === 100) return "cien";
  return C[Math.floor(n / 100)] + (n % 100 ? " " + dec(n % 100) : "");
}
function anioLetras(y) { y = +y; const m = Math.floor(y / 1000), r = y % 1000; return (m === 1 ? "mil" : letras(m) + " mil") + (r ? " " + letras(r) : ""); }
const fechaLetras = (iso) => { if (!iso) return ""; const [y, m, d] = iso.split("-").map(Number); return `${letras(d)} de ${MESES[m - 1]} del ${anioLetras(y)}`.toUpperCase(); };
function toast(m) { const t = $("#toast"); t.textContent = m; t.style.display = "block"; clearTimeout(t._h); t._h = setTimeout(() => (t.style.display = "none"), 4200); }
function nextFolio(type, peek) {
  const y = new Date().getFullYear(); const c = DB.counters[type] || { year: y, next: 1 };
  if (c.year !== y) { c.year = y; c.next = 1; }
  const f = `SIG-${type}-${y}-${String(c.next).padStart(4, "0")}`;
  if (!peek) { c.next++; DB.counters[type] = c; }
  return f;
}

function patientFields(extra = "") {

function wirePatient(form) {
  const ced = form.cedula, msg = $("#cedmsg", form);
  const fill = () => {
    const p = DB.patients[ced.value.replace(/\D/g, "")];
    if (p) { ["nombre", "nac", "sexo", "tel", "email", "ocupacion", "alergias", "domicilio", "empresa", "cargo"].forEach((k) => { if (form[k] && p[k] != null) form[k].value = p[k]; }); form.nac.dispatchEvent(new Event("change")); msg.textContent = "Paciente encontrado: datos cargados."; msg.className = "hint"; }
    else if (ced.value.replace(/\D/g, "").length === 10) { msg.textContent = cedulaOk(ced.value) ? "Cédula válida. Paciente nuevo." : "Revisa la cédula: el dígito verificador no coincide."; msg.className = cedulaOk(ced.value) ? "hint" : "hint warnt"; }
  };
  ced.addEventListener("change", fill); ced.addEventListener("input", () => { if (ced.value.replace(/\D/g, "").length === 10) fill(); });
  form.nac.addEventListener("change", () => { const e = edad(form.nac.value); if (e !== "") form.edad.value = e + " años"; });
}
function readPatient(form) {
  const p = { cedula: form.cedula.value.replace(/\D/g, ""), nombre: form.nombre.value.trim(), nac: form.nac.value, edad: form.edad.value.trim(), sexo: form.sexo.value, tel: form.tel.value.trim() };
  if (form.email && form.email.value.trim()) p.email = form.email.value.trim();
  if (form.ocupacion) p.ocupacion = form.ocupacion.value.trim();
  if (form.alergias) p.alergias = form.alergias.value.trim();
  ["domicilio", "empresa", "cargo"].forEach((k) => { if (form[k]) p[k] = form[k].value.trim(); });
  return p;
}
function storePatient(p) { const old = DB.patients[p.cedula] || {}; DB.patients[p.cedula] = Object.assign(old, p, { updated: today() }); }

function interp(k, v) {

}

function download(text, name, type) { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }

/* ---------- documents ---------- */
function qrSvg(text) { const q = qrcode(0, "M"); q.addData(text); q.make(); return q.createSvgTag({ cellSize: 3, margin: 0, scalable: true }); }
function chrome(doc, orient) {
  const s = DB.settings, wa = `https://wa.me/${s.wa}?text=${encodeURIComponent("Hola, quiero verificar el documento con folio " + doc.folio)}`;
  const mt = `SIGNO MEDICINA INTEGRAL · DOCUMENTO ORIGINAL · ${doc.folio} · `.repeat(orient === "l" ? 6 : 4);
  return {
    head: (title, sub, hoja) => `<div class="lh"><img src="${LOGO}" alt="Signo"><div class="dr"><b>${esc(s.nombre)}</b><br>${esc(s.titulo)}<br>Registro SENESCYT ${esc(s.senescyt)}</div></div>
      <div class="tb"><div class="tt"><b>${title}</b><span>${sub}</span></div><div class="fb"><small>FOLIO</small><b>${doc.folio}</b><i>${hoja || "Emitido: " + fmt(doc.date)}</i></div></div>`,
    foot: `<svg class="ecg" viewBox="0 0 1000 24" preserveAspectRatio="none"><path d="M0 15 H600 L612 15 L622 9 L632 15 L640 15 L650 1 L662 23 L670 15 H1000" fill="none" stroke="#0B7A72" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>
      <div class="pf"><div class="tx">${esc(s.dir)} · WhatsApp <a href="https://wa.me/${s.wa}">${esc(s.tel)}</a> · <a href="mailto:${esc(s.email)}">${esc(s.email)}</a><br>
      <a href="${wa}">Folio ${doc.folio} · Verifique la autenticidad escaneando el código o escribiendo al ${esc(s.tel)}</a>${doc.status === "Anulada" ? ' · <b style="color:#B4532A">DOCUMENTO ANULADO</b>' : ""}<div class="mt">${mt}</div></div>
      <a class="qr" href="${wa}">${qrSvg(wa)}</a></div>`,
    sig: (mode) => mode === "m" ? `<div class="who"><div class="line"></div><b>${esc(s.nombre)}</b><br>Médico · C.I. ${fmtCed(s.ci)}<br>Registro SENESCYT ${esc(s.senescyt)} · Firma y sello</div>`
      : `<div class="who"><small>FIRMADO ELECTRÓNICAMENTE POR</small><b>${esc(s.nombre)}</b><br>Médico · C.I. ${fmtCed(s.ci)}<br>Registro SENESCYT ${esc(s.senescyt)}<br>${esc(s.email)}</div>`,
    wm: `<img class="wm" src="${WM}" alt="">`,
  };
}
const ptable = (p, extra = []) => {
  const rows = [["Cédula", fmtCed(p.cedula), "Edad", p.edad || (p.nac ? edad(p.nac) + " años" : "")], ["Fecha de nacimiento", fmt(p.nac), "Sexo", p.sexo], ...extra];
  return `<table class="d"><tr><td class="l">Paciente</td><td colspan="3"><b>${esc(p.nombre)}</b></td></tr>${rows.map((r) => `<tr><td class="l">${r[0]}</td><td><b>${esc(r[1])}</b></td><td class="l">${r[2]}</td><td><b>${esc(r[3])}</b></td></tr>`).join("")}</table>`;
};

function renderRX(doc, mode) {
  const c = chrome(doc, "l"), s = DB.settings, d = doc.data, p = doc.patient;
  const pages = []; for (let i = 0; i < Math.max(1, d.meds.length); i += 8) pages.push(d.meds.slice(i, i + 8));
  const pinfo = (full) => `<table class="d"><tr><td class="l">Paciente</td><td colspan="3"><b>${esc(p.nombre)}</b></td></tr>
    <tr><td class="l">Cédula</td><td><b>${fmtCed(p.cedula)}</b></td><td class="l">Fecha</td><td><b>${fmt(doc.date)}</b></td></tr>
    ${full ? `<tr><td class="l">Edad</td><td><b>${esc(p.edad || (p.nac ? edad(p.nac) + " años" : ""))}</b></td><td class="l">Sexo</td><td><b>${esc(p.sexo)}</b></td></tr>
    <tr><td class="l">Diagnóstico</td><td colspan="2"><b>${esc(d.dx)}</b></td><td><span class="sm">CIE-10:</span> <b>${esc(d.cie)}</b></td></tr>
    <tr><td class="l">Alergias</td><td colspan="3"><b>${esc(p.alergias || "No refiere")}</b></td></tr>` : ""}</table>`;
  return pages.map((meds, pi) => {
    const hoja = `Hoja ${pi + 1} de ${pages.length}`, off = pi * 8;
    const fill = (n) => Array.from({ length: 8 - n }, (_, k) => k === 0 ? "—" : "");
    const left = `${c.head("RECETA MÉDICA", "Para la farmacia · Prescripción por nombre genérico (DCI)", hoja)}${pinfo(true)}<div class="rp">Rp.</div>
      <table class="d"><tr><th style="width:5%">#</th><th style="width:37%">Medicamento (DCI)</th><th>Concentración</th><th>Forma farm.</th><th style="width:24%">Cantidad</th></tr>
      ${meds.map((m, i) => `<tr><td>${off + i + 1}.</td><td><b>${esc(m.dci)}</b></td><td>${esc(m.conc)}</td><td>${esc(m.forma)}</td><td><b>${esc(m.cant)}</b>${m.letras ? ` (${m.letras})` : ""}</td></tr>`).join("")}
      ${fill(meds.length).map((x, k) => `<tr><td>${off + meds.length + k + 1}.</td><td>${x}</td><td></td><td></td><td></td></tr>`).join("")}</table>
      <div class="sm"><i>Válida por ${esc(s.validezRx)} días desde su emisión. Sin enmendaduras.</i></div><div class="sig">${c.sig(mode)}</div>`;
    const right = `${c.head("INDICACIONES", "Para el paciente · Cómo tomar su medicación", hoja)}${pinfo(false)}
      <table class="d"><tr><th style="width:5%">#</th><th style="width:31%">Medicamento</th><th>Dosis</th><th>Vía</th><th>Frecuencia</th><th>Duración</th></tr>
      ${meds.map((m, i) => `<tr><td>${off + i + 1}.</td><td><b>${esc(m.dci)}</b> ${esc(m.conc)}</td><td>${esc(m.dosis)}</td><td>${esc(m.via)}</td><td>${esc(m.frec)}</td><td>${esc(m.dur)}</td></tr>`).join("")}
      ${fill(meds.length).map((x, k) => `<tr><td>${off + meds.length + k + 1}.</td><td>${x}</td><td></td><td></td><td></td><td></td></tr>`).join("")}</table>
      ${pi === pages.length - 1 ? `<div class="sec">RECOMENDACIONES</div><div class="blank" style="white-space:pre-wrap">${esc(d.recom)}</div>
      <div class="sec">ACUDA DE INMEDIATO SI PRESENTA</div><div class="blank" style="white-space:pre-wrap">${esc(d.alarma)}</div>
      <div style="font-size:8.6pt;margin-top:6px"><b>Próximo control:</b> ${d.control ? fmt(d.control) : "____ / ____ / ________"} &nbsp; <span style="color:#0B7A72;font-weight:700">Citas y dudas: WhatsApp ${esc(s.tel)}</span></div>` : ""}
      <div class="sig">${c.sig(mode)}</div>`;
    return `<div class="page a4l">${c.wm}<div class="z halves"><div>${left}</div><div>${right}</div></div>${c.foot}</div>`;
  }).join("");
}

function renderSM(doc, mode) {
  const c = chrome(doc, "p"), d = doc.data, p = doc.patient, s = DB.settings;
  const motivos = ["Ingreso o requisito laboral", "Requisito académico", "Trámite legal o administrativo", "Otro"];
  const chk = (on, t) => `<span style="margin-right:12px">${on ? "☒" : "☐"} ${on ? "<b>" + t + "</b>" : t}</span>`;
  const p1 = `${c.head("CERTIFICADO MÉDICO", "de buen estado de salud mental")}
    <div style="text-align:right;font-size:9.4pt;margin-bottom:5px">${esc(s.ciudad)}, ${largo(doc.date)}</div>
    <div style="font-size:9.4pt;margin-bottom:6px">El suscrito, médico legalmente autorizado para el ejercicio profesional, <b>CERTIFICA</b> que ha evaluado a:</div>
    ${ptable(p, [["Ocupación", p.ocupacion || "", "Fecha de evaluación", fmt(d.feval)], ["Modalidad", d.modal, "Lugar", s.ciudad]])}
    <div style="font-size:8.8pt;margin:4px 0 2px"><b>Motivo de la certificación:</b> ${motivos.map((m) => chk(d.motivo === m, m + (m === "Otro" && d.motivo === "Otro" && d.motivod ? ": " + esc(d.motivod) : ""))).join("")}</div>
    ${d.motivod && d.motivo !== "Otro" ? `<div class="sm">Detalle: ${esc(d.motivod)}</div>` : ""}
    <div class="sec"><em>01</em>EXAMEN DEL ESTADO MENTAL</div>
    <table class="d"><tr><th>Función evaluada</th><th>Hallazgo esperado</th><th>Resultado</th><th>Observaciones</th></tr>
    ${d.exam.map((e) => `<tr><td>${esc(e.n)}</td><td>${esc(e.h)}</td><td><b>${esc(e.r)}</b></td><td>${esc(e.o)}</td></tr>`).join("")}</table>
    <div class="sec"><em>02</em>INSTRUMENTOS DE TAMIZAJE APLICADOS</div>
    <table class="d"><tr><th>Instrumento</th><th>Evalúa</th><th>Rango sin alteración</th><th>Puntaje</th><th>Interpretación</th></tr>
    ${d.scales.map((x) => `<tr><td>${esc(x.n)}</td><td>${esc(x.ev)}</td><td>${esc(x.r)}</td><td><b>${esc(x.s)}</b></td><td>${esc(x.i)}</td></tr>`).join("")}</table>
    <div class="sm"><i>El punto de corte del MMSE se ajusta según la edad y la escolaridad.</i> &nbsp; <b>Valoración psicológica complementaria:</b> ${esc(d.psi)}${d.psid ? " · " + esc(d.psid) : ""}</div>`;
  const ant = ["Antecedentes psiquiátricos o psicológicos", "Hospitalizaciones por salud mental", "Consumo de sustancias", "Medicación actual"];
  const p2 = `${c.head("CERTIFICADO MÉDICO", "de buen estado de salud mental", "Página 2 de 2")}
    <div class="sec"><em>03</em>ANTECEDENTES RELEVANTES</div>
    <table class="d"><tr><th>Antecedente</th><th>Detalle</th></tr>${ant.map((a, i) => `<tr><td>${a}</td><td>${esc(d.ant[i])}</td></tr>`).join("")}</table>
    <div class="sec"><em>04</em>CONCLUSIÓN</div><div class="concl">${esc(d.concl)}\n\n<span class="sm">Validez del certificado: ${esc(d.validez)} días a partir de la fecha de emisión.</span></div>
    <div class="sec"><em>05</em>NOTA ACLARATORIA</div>
    <div class="sm" style="text-align:justify">Este certificado describe el estado de ${p.sexo === "Femenino" ? "la paciente" : "el paciente"} al momento de la evaluación. Se basa en el examen clínico y en instrumentos de tamizaje; no reemplaza una evaluación psicológica o psiquiátrica especializada. Se extiende a petición ${p.sexo === "Femenino" ? "de la interesada" : "del interesado"} para los fines que estime convenientes.</div>
    <div class="sig">${c.sig(mode)}</div>
    ${mode === "e" ? `<div class="sm" style="text-align:center;margin-top:8px"><i>Documento firmado electrónicamente conforme a la Ley de Comercio Electrónico, Firmas Electrónicas y Mensajes de Datos del Ecuador.</i></div>` : ""}`;
  return `<div class="page a4p">${c.wm}<div class="z">${p1}</div>${c.foot}</div><div class="page a4p">${c.wm}<div class="z">${p2}</div>${c.foot}</div>`;
}

function renderCM(doc, mode) {
  const c = chrome(doc, "p"), d = doc.data, p = doc.patient, s = DB.settings;
  const sub = d.tipo.replace("Certificado de ", "de ");
  return `<div class="page a4p">${c.wm}<div class="z">${c.head("CERTIFICADO MÉDICO", sub)}
    <div style="text-align:right;font-size:9.4pt;margin-bottom:8px">${esc(s.ciudad)}, ${largo(doc.date)}</div>
    ${ptable(p, [["Ocupación", p.ocupacion || "", "Fecha de atención", fmt(d.feval)]])}
    <div class="sec"><em>01</em>CERTIFICACIÓN</div><div class="concl" style="font-size:10.4pt;line-height:1.6">${esc(d.texto)}</div>
    <div class="sm" style="margin-top:8px">Se extiende el presente certificado a petición ${p.sexo === "Femenino" ? "de la interesada" : "del interesado"} para los fines que estime convenientes.</div>
    <div class="sig" style="margin-top:22mm">${c.sig(mode)}</div>
    ${mode === "e" ? `<div class="sm" style="text-align:center;margin-top:8px"><i>Documento firmado electrónicamente conforme a la Ley de Comercio Electrónico, Firmas Electrónicas y Mensajes de Datos del Ecuador.</i></div>` : ""}
    </div>${c.foot}</div>`;
}

function renderIE(doc, mode) {
  const c = chrome(doc, "p"), d = doc.data, p = doc.patient, s = DB.settings, U = (x) => esc(String(x || "").toUpperCase());
  const fem = p.sexo === "Femenino", [y, m, dd] = doc.date.split("-").map(Number);
  const box = (on) => (on ? "(X)" : "(&nbsp;&nbsp;)");
  const conts = ["ENFERMEDAD GENERAL", "ACCIDENTE DE TRABAJO", "ENFERMEDAD PROFESIONAL"];
  const dias = +d.dias || 0;
  return `<div class="page a4p">${c.wm}<div class="z ie">
    <div class="lh"><img src="${LOGO}" alt="Signo"><div class="dr"><b>${esc(s.nombre)}</b><br>${esc(s.titulo)}<br>${esc(s.dir)}<br>Celular: ${esc(s.tel)} · Email: ${esc(s.email)}</div></div>
    <div style="display:flex;justify-content:space-between;font-size:10.5pt;margin:4mm 0 6mm"><span class="sm">Folio <b class="tag">${doc.folio}</b></span><span>${esc(s.ciudad)}, ${dd} de ${MESES[m - 1].toUpperCase()} del ${y}</span></div>
    <div style="text-align:center;font-weight:700;font-size:12pt;margin-bottom:6mm">CERTIFICADO MÉDICO</div>
    <p class="iep">CERTIFICO QUE ${fem ? "LA PACIENTE" : "EL PACIENTE"}, <b>${U(p.nombre)},</b> CON <b>CI. ${esc(p.cedula)}</b>, ACUDE A ESTA CASA DE SALUD EL ${d.feval ? (([yy, mm, dd2]) => `${+dd2} DE ${MESES[+mm - 1].toUpperCase()} DEL ${yy}`)(d.feval.split("-")) : ""} EN LA UNIDAD MEDICA: <b>${U(d.unidad)}</b>, CON CUADRO CLINICO DE <b>${U(d.cuadro)},</b> ${U(d.valor).replace("VALORADO(A)", fem ? "VALORADA" : "VALORADO")}</p>
    <p class="iep" style="margin-bottom:1mm"><b>Diagnóstico:</b></p>
    <ul class="iel">${d.dxs.map((x) => `<li><b>${U(x.dx)}${x.cie ? " – CIE10: " + U(x.cie) : ""}</b></li>`).join("")}</ul>
    <div class="ied">
      <div>DATOS LABORALES: ${U(p.empresa)}</div><div>PUESTO LABORAL: ${U(p.cargo)}</div><div>DOMICILIO: ${U(p.domicilio)}</div>
      <div>TELEFONO: ${esc(p.tel)}</div><div>HISTORIA CLINICA: ${esc(d.hc)}</div>
      <div>REPOSO MEDICO: SI ${box(d.reposo === "SI")} NO ${box(d.reposo === "NO")}</div>
      <div>TIPO DE CONTINGENCIA: ${conts.map((x) => `${x} ${box(d.cont === x)}`).join("&nbsp;&nbsp; ")}</div>
      <div style="margin-top:4mm">${U(d.trat)}</div>
      ${d.reposo === "SI" ? `<div style="margin-top:4mm">SE INDICA REPOSO MEDICO POR ${letras(dias).toUpperCase()} (${dias}) ${dias === 1 ? "DIA" : "DIAS"}.</div>
      <div>DESDE: ${fmt(d.desde)} – (${fechaLetras(d.desde)})</div><div>HASTA: ${fmt(d.hasta)} – (${fechaLetras(d.hasta)})</div>` : ""}
    </div>
    <p class="iep" style="margin-top:6mm">Atentamente,</p>
    <div class="sig" style="margin-top:2mm">${mode === "m" ? `<div class="who"><div class="line"></div>` : `<div class="who"><small>FIRMADO ELECTRÓNICAMENTE POR</small>`}
      <div style="font-size:10pt;color:#12263A;line-height:1.45">${U(s.nombre.replace(/^Dr\.?\s*/i, ""))}.<br>MEDICO.<br>CI. ${esc(s.ci)}<br>REG. SEN. ${esc(s.senescyt)}<br>Correo electrónico: ${esc(s.email)}</div></div></div>
    </div>${c.foot}</div>`;
}

let CUR = null;
function renderDoc(doc, mode) { return doc.type === "RX" ? renderRX(doc, mode) : doc.type === "SM" ? renderSM(doc, mode) : doc.type === "IE" ? renderIE(doc, mode) : doc.type === "OL" ? renderOL(doc, mode) : renderCM(doc, mode); }
function openDoc(doc) {
  if (!doc) return; CUR = doc; PVMODE = "doc"; $("#sigwrap").style.display = "";
  $("#mtitle").textContent = `${doc.folio} · ${doc.patient.nombre}`;
  $("#mhint").textContent = doc.status === "Anulada" ? "Documento anulado" : "Revisa antes de imprimir. En la ventana de impresión elige «Guardar como PDF» para firmarlo electrónicamente.";
  const draw = () => { $("#pv").innerHTML = renderDoc(doc, $("#sigmode").value); fitPreview(); };
  $("#sigmode").onchange = draw; $("#modal").style.display = "block"; draw();
}
$("#mclose").onclick = () => { if (PVMODE === "msp") captureManual(); $("#modal").style.display = "none"; };
/* combinar un respaldo con los datos actuales (sin borrar nada) */
function mergeDB(d) {
  const n = { p: 0, d: 0, a: 0 };
  Object.values(d.patients || {}).forEach((p) => { const o = DB.patients[p.cedula]; if (!o || (p.updated || "") > (o.updated || "")) { DB.patients[p.cedula] = Object.assign({}, o || {}, p); n.p++; } else if (p.medidas && p.medidas.length) { const f = new Set((o.medidas || []).map((m) => m.fecha)); o.medidas = (o.medidas || []).concat(p.medidas.filter((m) => !f.has(m.fecha))); } });
  const fol = new Map(DB.docs.map((x, i) => [x.folio, i]));
  (d.docs || []).forEach((x) => { if (!fol.has(x.folio)) { DB.docs.push(x); n.d++; } else if (x.status === "Anulada" && DB.docs[fol.get(x.folio)].status !== "Anulada") { DB.docs[fol.get(x.folio)] = x; n.d++; } });
  DB.docs.sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : a.folio < b.folio ? 1 : -1));
  const ids = new Set((DB.atenciones || []).map((x) => x.id));
  (d.atenciones || []).forEach((x) => { if (!ids.has(x.id)) { DB.atenciones.push(x); n.a++; } });
  Object.entries(d.counters || {}).forEach(([k, c]) => { const o = DB.counters[k]; if (!o || (c.year === o.year && c.next > o.next) || c.year > o.year) DB.counters[k] = c; });
  if (d.atCount && (!DB.atCount || d.atCount.next > DB.atCount.next)) DB.atCount = d.atCount;
  save(); return n;
}
/* en pantallas pequeñas, achicar la vista previa para que quepa (no afecta la impresión) */
function fitPreview() {
  const pv = $("#pv"); if (!pv) return; const w = pv.clientWidth - 16;
  $$("#pv > .page, #pv > .mspp").forEach((p) => { p.style.zoom = ""; const pw = p.offsetWidth; p.style.zoom = pw > w && w > 100 ? (w / pw).toFixed(3) : ""; });
}
addEventListener("resize", () => { if ($("#modal").style.display === "block") fitPreview(); });
/* versión web: funcionar sin internet e instalarse como aplicación */
if (/^https?:/.test(location.protocol) && "serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
$("#sendwa").onclick = () => sendDialog("wa");
$("#sendmail").onclick = () => sendDialog("mail");
$("#doprint").onclick = () => {
  if (PVMODE === "msp") {
    captureManual();
    $("#pagecss").textContent = "@page{margin:0}";
    const pr = $("#print"); pr.innerHTML = "";
    $$("#pv .mspp").forEach((p) => { const c = p.cloneNode(true); c.classList.remove("edit"); c.style.zoom = ""; pr.appendChild(c); });
    const at = PVPAGES && PVPAGES.at, old = document.title;
    document.title = at ? `${at.id}_${at.patient.nombre.replace(/\s+/g, "_")}_HCU` : "Formularios_MSP";
    setTimeout(() => { window.print(); document.title = old; }, 150);
    return;
  }
  if (!CUR) return;
  $("#pagecss").textContent = `@page{size:A4 ${CUR.type === "RX" ? "landscape" : "portrait"};margin:0}`;
  $("#print").innerHTML = renderDoc(CUR, $("#sigmode").value);
  const old = document.title; document.title = `${CUR.folio}_${CUR.patient.nombre.replace(/\s+/g, "_")}`;
  setTimeout(() => { window.print(); document.title = old; }, 150);
};
